name: Pair Game Registration
description: Register your pair repository to display on the workshop Game Wall
title: "[Game Registration]: "
labels: ["game-registration"]
body:
  - type: markdown
    attributes:
      value: |
        ### Register a match
        Submit one registration for each match branch in your pair's public repository. The Game Wall reads the case-sensitive `BOARD.txt` file from the branch you enter. Keep the match branch on its own; do not merge it into `main`.
  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      description: Full URL to your pair's public GitHub repository.
      placeholder: https://github.com/username/repository
    validations:
      required: true
  - type: input
    id: match_branch
    attributes:
      label: Match branch
      description: Numbered match branch created from the clean main branch (for example, match-01).
      placeholder: match-01
    validations:
      required: true
  - type: input
    id: player_x
    attributes:
      label: Player X Handle
      description: GitHub username for Player X (with or without @).
      placeholder: octocat
    validations:
      required: true
  - type: input
    id: player_o
    attributes:
      label: Player O Handle
      description: GitHub username for Player O (with or without @).
      placeholder: hubot
    validations:
      required: true
  - type: input
    id: workshop_name
    attributes:
      label: Workshop Name
      description: Workshop or cohort name for this training session.
      value: "SCDA Training Week"
      placeholder: "SCDA Training Week"
    validations:
      required: false
