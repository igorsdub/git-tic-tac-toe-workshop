name: Pair Game Registration
description: Register your pair repository to display on the workshop Game Wall
title: "[Game Registration]: "
labels: ["game-registration"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🎮 Register for the Big Screen Game Wall
        Submit this quick form to display your paired match live on the classroom projector screen! Ensure your repository is **public** so the Game Wall can read your board.md. Only **one partner** needs to submit this form for your pair.
  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      description: Full URL to your pair's public GitHub repository.
      placeholder: https://github.com/username/repository
    validations:
      required: true
  - type: input
    id: player_x
    attributes:
      label: Player X Handle
      description: GitHub username for Player X (with or without @).
      placeholder: octocat
    validations:
      required: true
  - type: input
    id: player_o
    attributes:
      label: Player O Handle
      description: GitHub username for Player O (with or without @).
      placeholder: hubot
    validations:
      required: true
  - type: input
    id: workshop_name
    attributes:
      label: Workshop Name
      description: Workshop or cohort name for this training session.
      value: "SCDA Training Week"
      placeholder: "SCDA Training Week"
    validations:
      required: false
