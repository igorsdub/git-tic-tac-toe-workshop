name: Sync Registrations to Board JSON

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "CONTEXT.md"
      - ".github/workflows/sync-registrations.yml"
  issues:
    types: [opened, edited, labeled, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: game-wall-registration-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Sync registrations and discovered match branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_board_registry.py

      - name: Commit and push generated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/board.json docs/registrations.json docs/registry-status.json
          if git diff --cached --quiet; then
            echo "No generated snapshot changes"
          else
            git commit -m "chore(registry): sync workshop registrations and matches [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed Game Wall
        id: deployment
        uses: actions/deploy-pages@v4
