name: Sync Registrations to Board JSON

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "CONTEXT.md"
      - ".github/workflows/sync-registrations.yml"
  issues:
    types: [opened, edited, labeled, closed, reopened]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy Pages even if the sync made no change"
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: game-wall-registration-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Issue events carry the commit that existed when the issue changed.
          # A queued run must start from the current branch tip instead.
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish current registration and match snapshots
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          set -euo pipefail
          python3 scripts/publish_registry_snapshots.py | tee "$RUNNER_TEMP/publish.log"
          changed=false
          if grep -qx 'Published generated registration and match snapshots' "$RUNNER_TEMP/publish.log"; then changed=true; fi
          # A push to main that touched docs/, scripts/ or this workflow must still redeploy the site.
          if [ "$EVENT_NAME" = "push" ]; then changed=true; fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_DEPLOY" = "true" ]; then changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.publish.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  deploy:
    if: github.ref == 'refs/heads/main' && needs.sync.outputs.changed == 'true'
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed Game Wall
        id: deployment
        uses: actions/deploy-pages@v4
