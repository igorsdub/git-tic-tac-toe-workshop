name: Sync Registrations to Board JSON

on:
  issues:
    types: [opened, edited, labeled, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: game-wall-registration-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Sync registrations and discovered match branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_board_registry.py

      - name: Commit and push generated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/board.json docs/registrations.json docs/registry-status.json
          if git diff --cached --quiet; then
            echo "No generated snapshot changes"
          else
            git commit -m "chore(registry): sync workshop registrations and matches [skip ci]"
            git push
          fi
