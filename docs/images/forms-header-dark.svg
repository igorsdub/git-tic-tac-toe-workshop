<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" fill="none">
  <rect width="1600" height="400" fill="#000000"/>

  <!-- Each board scales the template's 96-unit grid and mark proportions by 2.75. -->
  <defs>
    <g id="board-grid" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#737373" stroke-width="2">
        <path d="M 32 2 V 94 M 64 2 V 94 M 2 32 H 94 M 2 64 H 94"/>
      </g>
    </g>
    <g id="center-x" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <path d="M 42 42 L 54 54 M 54 42 L 42 54"/>
    </g>
    <g id="upper-left-o" stroke="#ffffff" stroke-width="2.2" fill="none">
      <circle cx="16" cy="16" r="7"/>
    </g>
    <g id="removed-upper-left-o" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="2 2" fill="none">
      <circle cx="16" cy="16" r="7"/>
    </g>
    <g id="lower-right-o" stroke="#ffffff" stroke-width="2.2" fill="none">
      <circle cx="80" cy="80" r="7"/>
    </g>
  </defs>

  <g transform="translate(68 68) scale(2.75)">
    <use href="#board-grid"/>
    <use href="#center-x"/>
  </g>
  <g transform="translate(468 68) scale(2.75)">
    <use href="#board-grid"/>
    <use href="#center-x"/>
    <use href="#upper-left-o"/>
  </g>
  <g transform="translate(868 68) scale(2.75)">
    <use href="#board-grid"/>
    <use href="#center-x"/>
    <use href="#removed-upper-left-o"/>
  </g>
  <g transform="translate(1268 68) scale(2.75)">
    <use href="#board-grid"/>
    <use href="#center-x"/>
    <use href="#lower-right-o"/>
  </g>
</svg>
