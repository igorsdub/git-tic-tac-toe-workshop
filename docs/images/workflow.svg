<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
      .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #58a6ff; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      .code-txt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 600; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #8b949e; }
      .board-label { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #c9d1d9; }
      .board-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; fill: #8b949e; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
      .loop-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #58a6ff; }
    </style>
  </defs>

  <!-- Container Canvas -->
  <rect width="800" height="240" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Header Bar -->
  <g transform="translate(24, 20)">
    <!-- Branch / Commit Icon -->
    <circle cx="4" cy="4" r="2.5" fill="#58a6ff"/>
    <circle cx="4" cy="15" r="2.5" fill="#58a6ff"/>
    <circle cx="13" cy="15" r="2.5" fill="#3fb950"/>
    <path d="M 4 6.5 V 12.5 M 4 9 C 7 9 13 10 13 12.5" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    
    <text x="24" y="14" class="title">GIT TIC-TAC-TOE</text>
    <rect x="142" y="2" width="168" height="18" rx="9" fill="#388bfd1a" stroke="#388bfd40" stroke-width="1"/>
    <text x="226" y="14.5" text-anchor="middle" class="badge-txt">COLLABORATIVE WORKFLOW</text>
    <text x="752" y="14" text-anchor="end" class="subtitle">Two players • One repository • Alternating turns</text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="45" x2="776" y2="45" stroke="#21262d" stroke-width="1" />

  <!-- Left: 3x3 Tic-Tac-Toe Board Container -->
  <g transform="translate(24, 54)">
    <rect width="156" height="170" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />

    <!-- File Tab Header -->
    <text x="78" y="20" text-anchor="middle" class="board-label">board.md</text>

    <!-- 3x3 Grid (96x96 px) -->
    <g transform="translate(30, 28)">
      <!-- Grid Base -->
      <rect width="96" height="96" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

      <!-- Move Highlight for center cell (X) -->
      <rect x="33" y="33" width="30" height="30" rx="3" fill="#388bfd26" stroke="#58a6ff" stroke-width="1"/>

      <!-- Grid Division Lines -->
      <line x1="32" y1="2" x2="32" y2="94" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
      <line x1="64" y1="2" x2="64" y2="94" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
      <line x1="2" y1="32" x2="94" y2="32" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
      <line x1="2" y1="64" x2="94" y2="64" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

      <!-- Marks -->
      <!-- Row 0: X, O, . -->
      <path d="M 10 10 L 22 22 M 22 10 L 10 22" stroke="#f0f6fc" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="48" cy="16" r="7" stroke="#f0883e" stroke-width="2.2" fill="none"/>

      <!-- Row 1: ., X (Center active), O -->
      <path d="M 42 42 L 54 54 M 54 42 L 42 54" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="80" cy="48" r="7" stroke="#f0883e" stroke-width="2.2" fill="none"/>

      <!-- Row 2: O, ., X -->
      <circle cx="16" cy="80" r="7" stroke="#f0883e" stroke-width="2.2" fill="none"/>
      <path d="M 74 74 L 86 86 M 86 74 L 74 86" stroke="#f0f6fc" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Board Caption -->
    <text x="78" y="142" text-anchor="middle" class="board-sub">Move 5 • Turn State</text>
    <rect x="30" y="149" width="96" height="13" rx="3" fill="#21262d"/>
    <text x="78" y="159" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="8" font-weight="600" fill="#8b949e">PLAYER X VS PLAYER O</text>
  </g>

  <!-- Right: 5-Step Collaborative Turn Cycle Pipeline -->
  <!-- Card 1: PULL (x = 196) -->
  <g transform="translate(196, 54)">
    <rect width="100" height="126" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="50" cy="22" r="11" fill="#1f6feb"/>
    <text x="50" y="26" text-anchor="middle" class="step-num">1</text>
    <text x="50" y="47" text-anchor="middle" class="card-title">PULL</text>
    <rect x="9" y="55" width="82" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="50" y="70" text-anchor="middle" class="code-txt" fill="#58a6ff">git pull</text>
    <text x="50" y="93" text-anchor="middle" class="card-desc">Fetch partner's</text>
    <text x="50" y="106" text-anchor="middle" class="card-desc">latest move</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <line x1="300" y1="120" x2="312" y2="120" stroke="#484f58" stroke-width="2" stroke-linecap="round"/>
    <polygon points="311,116 316,120 311,124" fill="#484f58"/>
  </g>

  <!-- Card 2: EDIT (x = 317) -->
  <g transform="translate(317, 54)">
    <rect width="100" height="126" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="50" cy="22" r="11" fill="#bd561d"/>
    <text x="50" y="26" text-anchor="middle" class="step-num">2</text>
    <text x="50" y="47" text-anchor="middle" class="card-title">EDIT</text>
    <rect x="9" y="55" width="82" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="50" y="70" text-anchor="middle" class="code-txt" fill="#f0883e">board.md</text>
    <text x="50" y="93" text-anchor="middle" class="card-desc">Mark [X] or [O]</text>
    <text x="50" y="106" text-anchor="middle" class="card-desc">and update state</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <line x1="421" y1="120" x2="433" y2="120" stroke="#484f58" stroke-width="2" stroke-linecap="round"/>
    <polygon points="432,116 437,120 432,124" fill="#484f58"/>
  </g>

  <!-- Card 3: STAGE (x = 438) -->
  <g transform="translate(438, 54)">
    <rect width="100" height="126" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="50" cy="22" r="11" fill="#9e6a03"/>
    <text x="50" y="26" text-anchor="middle" class="step-num">3</text>
    <text x="50" y="47" text-anchor="middle" class="card-title">STAGE</text>
    <rect x="9" y="55" width="82" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="50" y="70" text-anchor="middle" class="code-txt" fill="#d29922">git add</text>
    <text x="50" y="93" text-anchor="middle" class="card-desc">Stage board.md</text>
    <text x="50" y="106" text-anchor="middle" class="card-desc">for snapshot</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g>
    <line x1="542" y1="120" x2="554" y2="120" stroke="#484f58" stroke-width="2" stroke-linecap="round"/>
    <polygon points="553,116 558,120 553,124" fill="#484f58"/>
  </g>

  <!-- Card 4: COMMIT (x = 559) -->
  <g transform="translate(559, 54)">
    <rect width="100" height="126" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="50" cy="22" r="11" fill="#6e40c9"/>
    <text x="50" y="26" text-anchor="middle" class="step-num">4</text>
    <text x="50" y="47" text-anchor="middle" class="card-title">COMMIT</text>
    <rect x="9" y="55" width="82" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="50" y="70" text-anchor="middle" class="code-txt" fill="#bc8cff">git commit</text>
    <text x="50" y="93" text-anchor="middle" class="card-desc">Save move to</text>
    <text x="50" y="106" text-anchor="middle" class="card-desc">project history</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g>
    <line x1="663" y1="120" x2="675" y2="120" stroke="#484f58" stroke-width="2" stroke-linecap="round"/>
    <polygon points="674,116 679,120 674,124" fill="#484f58"/>
  </g>

  <!-- Card 5: PUSH (x = 680) -->
  <g transform="translate(680, 54)">
    <rect width="100" height="126" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="50" cy="22" r="11" fill="#238636"/>
    <text x="50" y="26" text-anchor="middle" class="step-num">5</text>
    <text x="50" y="47" text-anchor="middle" class="card-title">PUSH</text>
    <rect x="9" y="55" width="82" height="22" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="50" y="70" text-anchor="middle" class="code-txt" fill="#3fb950">git push</text>
    <text x="50" y="93" text-anchor="middle" class="card-desc">Publish move to</text>
    <text x="50" y="106" text-anchor="middle" class="card-desc">shared repository</text>
  </g>

  <!-- Collaborative Loop / Return Arrow -->
  <path d="M 730 180 V 194 Q 730 204 718 204 H 258 Q 246 204 246 194 V 183" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="242,185 246,179 250,185" fill="#58a6ff"/>

  <!-- Loop Label Pill -->
  <g transform="translate(356, 193)">
    <rect width="264" height="22" rx="11" fill="#161b22" stroke="#388bfd" stroke-width="1" />
    <text x="132" y="15" text-anchor="middle" class="loop-txt">⇄  Partner pulls your move &amp; takes their turn</text>
  </g>
</svg>
